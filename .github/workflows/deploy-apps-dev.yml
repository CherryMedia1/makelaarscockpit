name: deploy-apps-dev
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/**', 'db/**', 'infra/bicep/apps.bicep', 'package-lock.json', '.github/workflows/deploy-apps-dev.yml']
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-apps-dev
  cancel-in-progress: false
jobs:
  apps:
    runs-on: ubuntu-latest
    environment: dev
    env:
      RG: rg-cockpit-dev-neu
      REGISTRY: crcockpitneu
      WEB_IMAGE: crcockpitneu.azurecr.io/web:${{ github.sha }}
      MIGRATIE_IMAGE: crcockpitneu.azurecr.io/migratie:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Images bouwen en pushen
        run: |
          az acr login --name "$REGISTRY"
          docker build -f db/Dockerfile -t "$MIGRATIE_IMAGE" db
          docker build -f apps/web/Dockerfile -t "$WEB_IMAGE" .
          docker push "$MIGRATIE_IMAGE"
          docker push "$WEB_IMAGE"
      - name: Applicatielaag deployen
        run: |
          az deployment group create -g "$RG" -f infra/bicep/apps.bicep \
            -p env=dev webImage="$WEB_IMAGE" migratieImage="$MIGRATIE_IMAGE" \
            --query properties.outputs.webUrl.value -o tsv
      - name: Databasemigraties uitvoeren
        run: |
          JOB=job-migratie-cockpit-dev-neu
          EXEC=$(az containerapp job start -g "$RG" -n "$JOB" --query name -o tsv)
          echo "uitvoering: $EXEC"
          for i in $(seq 1 60); do
            STATUS=$(az containerapp job execution show -g "$RG" -n "$JOB" --job-execution-name "$EXEC" --query properties.status -o tsv)
            echo "status: $STATUS"
            case "$STATUS" in
              Succeeded) break ;;
              Failed|Stopped|Degraded) break ;;
            esac
            sleep 10
          done
          az containerapp job logs show -g "$RG" -n "$JOB" --execution "$EXEC" --container migratie --format text || true
          test "$STATUS" = "Succeeded" || { echo "::error::migraties mislukt (staat Postgres aan? draai infra/scripts/dev-aan.sh)"; exit 1; }
